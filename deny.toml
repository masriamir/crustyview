[graph]
all-features = true

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path deps carry no version requirement: every crate here is
# `publish = false`, so the requirement would be meaningless and would pin to a
# stale `^0.1.0` as the workspace version moves. This exemption applies only to
# private crates, so public-crate wildcards are still denied.
allow-wildcard-paths = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
