version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # `github/codeql-action/init` and `.../analyze` are separate dependencies to
    # Dependabot but one version to CodeQL, which refuses to run a mismatched
    # pair. Ungrouped, a release bumps whichever it sees first and breaks the
    # `analyze` job (#168, observed on #135). Grouping proposes them as one PR.
    #
    # Deliberately narrow. `taiki-e/install-action` also appears at several SHAs,
    # but one per TOOL rather than one per release, and grouping those would
    # collapse pins that are meant to differ (see CLAUDE.md).
    #
    # Two patterns rather than one `github/codeql-action*`: a github-actions
    # dependency name carries its path (`github/codeql-action/init`), and whether
    # `*` matches across `/` depends on Dependabot's matcher, which cannot be
    # tested on demand — grouping only shows itself when a release lands. These
    # two are correct either way, and cover the bare form as well as sub-actions.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
