name: PR Title

# PRs squash-merge, so the PR title becomes the only commit message on `main` and is
# the string git-cliff parses for changelog inclusion, section, and version bump
# (ADR-0004 policy item 5). Nothing else checks it: lefthook's `commit-msg` hook
# validates the branch commits, which are exactly what squash-merge discards.
#
# This is a **required** status check in the `Main Branch` ruleset, so a red X here
# genuinely blocks the merge rather than asking nicely. It was advisory until the repo
# went public on 2026-08-10 — rulesets are unavailable on a private repo on a free plan,
# which is also why a workflow used to request Copilot review (#106).
on:
  pull_request:
    # `edited` catches a retitle; `synchronize` re-attaches the check to each new head
    # SHA, so a push can't leave the latest commit without this signal.
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # This is the PR's merge ref, so the validator judging a PR is the copy that PR
      # ships. Known and accepted for now (#101): the self-test below catches an
      # accidental weakening, and a deliberate bypass needs no validator edit at all,
      # since no check here can be marked required and any PR can be merged over a red
      # X. Pinning this to `base.sha` becomes meaningful once that stops being true.
      - uses: actions/checkout@v7
      # The validator gates branch commits and PR titles alike, so a regression in it
      # disarms both gates at once. Prove it still rejects what it must before trusting
      # its verdict on this PR's title.
      - name: Self-test the validator
        run: scripts/test-conventional-subject.sh
      - name: Validate PR title
        env:
          # Via the environment, never interpolated into the script: a PR title is
          # attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 scripts/check-conventional-subject.py
