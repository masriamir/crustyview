name: PR Title

# PRs squash-merge, so the PR title becomes the only commit on `main` and is the
# string git-cliff parses for changelog inclusion, section, and version bump
# (ADR-0004 policy item 5). Nothing else checks it: lefthook's `commit-msg` hook
# validates branch commits, which are exactly what squash-merge discards.
#
# Calls the shared reusable workflow from masriamir/.github, which self-tests and
# then runs the vendored validator in scripts/ — kept identical to the canonical
# copy by the meta-check drift gate. This supersedes the earlier two-checkout
# scheme (#101's base-judges/PR-exercised split): the trust trade-offs of running
# PR-head code are documented in the reusable workflow's header.
#
# Required-check note: the check context is now `pr-title / pr-title` (caller
# job / reusable job); the `Main Branch` ruleset must require that context
# instead of the old bare `pr-title`.
on:
  pull_request:
    # `edited` catches a retitle; `synchronize` re-attaches the check to each new
    # head SHA, so a push can't leave the latest commit without this signal.
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    uses: masriamir/.github/.github/workflows/pr-title.yml@efdd25a9a97804a493fa54f9bb716289fb425d7e # main
