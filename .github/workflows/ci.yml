name: CI
on:
  push:
    branches: [main]
  pull_request:

# Stated rather than inherited. The repo default is already `read`, so this
# changes nothing today — it makes the contract local to the file, so a future
# job that needs more has to ask for it explicitly. No job here calls the API;
# `upload-artifact` uses the Actions runtime token, not `GITHUB_TOKEN`.
permissions:
  contents: read

# Superseded pushes to a PR are abandoned rather than run to completion.
#
# `main` runs must be untouched by this: they feed the Codecov base report and the
# CodeQL baseline, so losing one leaves that commit permanently without coverage data
# — the same hole the 2026-08-10 outage left on `2cd6908` and `2847b0f` (#109).
#
# `cancel-in-progress: false` is NOT sufficient to guarantee that, which is the whole
# reason the group key is shaped the way it is. A concurrency group admits one run at
# a time regardless, and when a new run is queued GitHub cancels any run already
# *pending* in that group. So a shared `main` group turns three rapid merges into
# "run 1 in progress, run 2 canceled, run 3 pending" — manufacturing the exact gap
# this comment claims to prevent. Keying non-PR events on `github.sha` gives every
# commit its own group, so `main` runs never queue behind each other and never
# cancel. `github.event_name` keeps a `schedule` run from colliding with the `push`
# run on the same SHA.
#
# For PRs the ref is stable across pushes, so successive heads share a group and the
# superseded one is canceled. A canceled job reports the check-run conclusion
# `cancelled` (GitHub's own spelling for that literal value — leave it alone; it is
# not a typo to fix), which does not satisfy a required check; the superseding run
# posts fresh check runs under the same names and the ruleset reads those.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The browser set the Playwright jobs install, and the same value that selects
# their cache entry. Declared once because the two MUST agree: a cache key that
# does not name its contents is how you get a job silently restoring an entry
# that lacks the browser it needs and re-downloading on every run behind a green
# check. The Playwright version in the key covers the browser *revision*
# (playwright-core pins it), so only the set needs stating here.
env:
  PLAYWRIGHT_BROWSERS: chromium

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          components: clippy
          # Required by the wasm clippy step below, not by the workspace one.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Not redundant with the line above, and the gap this closes was real:
      # `crustyview-web` gates its whole body on `#[cfg(target_arch = "wasm32")]`,
      # so a host-target clippy lints an empty shell — `WadDocument`, `version()`,
      # the entire browser API surface compile to nothing. Measured on #112: a
      # deliberate `needless_return` in `wad_document.rs` left the host run at
      # exit 0 with zero hits, while this run caught it at exit 101 with five.
      # Until this step existed, CI's lint was strictly weaker than `just lint`.
      #
      # `--all-targets` is load-bearing too, for the same reason one layer down:
      # `tests/web.rs` is `#![cfg(target_arch = "wasm32")]`, so without it the
      # wasm-bindgen test target goes un-linted even on a wasm run. Measured the
      # same way — the probe in `tests/web.rs` left this at exit 0 with zero hits
      # without the flag, and exit 101 with five once added. `--all-features`
      # is a no-op today (no crate declares features) and is here for parity with
      # the workspace run above, so a future feature cannot silently drop out.
      - name: Clippy on the wasm target
        run: cargo clippy -p crustyview-web --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings
      # The workspace MSRV must mirror the pinned crustywad release's (#52).
      # Both sides use the same `[... | tostring] | unique | join` shape, so the
      # comparison stays a single deterministic string: it catches drift between
      # our own members, survives more than one resolved crustywad, and reports a
      # missing rust-version as a literal `null` instead of an empty field.
      - name: MSRV matches crustywad
        run: |
          ws=$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].rust_version | tostring] | unique | join(",")')
          dep=$(cargo metadata --format-version 1 | jq -r '[.packages[] | select(.name=="crustywad") | .rust_version | tostring] | unique | join(",")')
          echo "workspace: $ws  crustywad: $dep"
          [ "$ws" = "$dep" ] || { echo "::error::rust-version drift: workspace $ws vs crustywad $dep"; exit 1; }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo test --workspace --all-features

  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo build -p crustyview-web --target wasm32-unknown-unknown

  wasm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
      - run: wasm-pack test --node crates/crustyview-web

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build wasm into the app
        run: cd crates/crustyview-web && wasm-pack build --target web --out-dir ../../web/src/wasm
      - name: Install, check, test, build
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4 # cargo-llvm-cov
      # `--all-features` mirrors the `test` job. No crate declares a `[features]`
      # table today, so this is a no-op — which is exactly why it belongs here now:
      # the moment a feature appears, coverage would otherwise silently stop
      # measuring the code behind it while `test` kept exercising it, and the gap
      # would read as "that code is covered" rather than "that code was skipped".
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # The action exits 0 on a rejected upload by default; both this and the
          # removal of `continue-on-error` are needed for a failure to be visible.
          fail_ci_if_error: true

  security-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - uses: taiki-e/install-action@c0977eb8b4952c1e8e932703147dba6f76856a53 # cargo-deny
      - run: cargo deny check

  sweep-freedoom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Fetch Freedoom
        run: ./scripts/fetch-freedoom.sh "$RUNNER_TEMP/freedoom"
      - name: Sweep Freedoom
        run: CRUSTYVIEW_WAD_DIR="$RUNNER_TEMP/freedoom" cargo test -p crustyview-core --test wad_sweep --all-features -- --nocapture

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch Freedoom
        run: ./scripts/fetch-freedoom.sh .freedoom
      - name: Build wasm into the app
        run: cd crates/crustyview-web && wasm-pack build --target web --out-dir ../../web/src/wasm
      - name: Install and build the app
        working-directory: web
        run: |
          npm ci
          npm run build
      # Cache the browser binaries (#194).
      #
      # The key names its contents: platform, arch, browser set, and the RESOLVED
      # playwright-core version. That is the whole design — an entry is shared by
      # the two Playwright jobs precisely as long as they want the same thing, and
      # the moment one of them installs a different browser set its key changes and
      # it gets its own entry. Nothing has to be remembered or kept in sync by hand,
      # which matters because the failure it prevents is invisible: a job restoring
      # an entry that lacks its browser would re-download on every single run,
      # forever, behind a green check.
      #
      # `PLAYWRIGHT_BROWSERS` (workflow-level) feeds both this key and the install
      # command below, so the two cannot drift apart. The browser *revision* needs
      # no separate component: playwright-core pins it, so the version covers it.
      #
      # Version rather than `hashFiles(package-lock.json)`: a lockfile hash busts on
      # every unrelated dependency bump, which is exactly when a Dependabot PR would
      # still eat the uncached download. No `restore-keys` either — a partial match
      # restores a different browser build that Playwright re-downloads anyway, so a
      # clean miss beats a misleading hit.
      #
      # On a COLD key both jobs miss and race to save it, and one will log
      # `Failed to save: Unable to reserve cache with key ..., another job may be
      # creating this cache`. That is benign: an atomic reservation, one winner,
      # identical contents either way, and the loser's job still passes with no
      # annotation. Measured on this change's first run — `web-browser-test` saved
      # 282 MB, `web-e2e` lost the race, both green — and on the second, where both
      # hit and skipped the download entirely. One save is all the next run needs.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: web
        # Assigned first rather than substituted inline: an inline `$(...)` inside
        # echo/printf discards the command's exit status, so a failing `node -p`
        # would write an empty value, pass the step, and yield the plausible-looking
        # key `playwright-Linux-` — caching the wrong thing silently, forever. The
        # assignment propagates the failure to `bash -e` instead. `printf` over
        # `echo` for the usual reason: no escape or leading-dash interpretation.
        run: |
          version=$(node -p "require('playwright-core/package.json').version")
          [ -n "$version" ] || { echo "::error::could not resolve the playwright-core version"; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_BROWSERS }}-${{ steps.playwright.outputs.version }}
      # Unchanged on purpose: with the cache restored this detects the browser is
      # already present and skips the download, leaving only the apt-get half of
      # `--with-deps`. A conditional install would buy nothing and add a branch.
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps "$PLAYWRIGHT_BROWSERS"
      - name: Run E2E smoke
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  web-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build wasm into the app
        run: cd crates/crustyview-web && wasm-pack build --target web --out-dir ../../web/src/wasm
      # No Freedoom fetch: the browser tier mocks the `wad` store rather than
      # loading a real WAD, but the modules under test still import from
      # web/src/wasm, so that path must resolve at transform time.
      - name: Install dependencies
        working-directory: web
        run: npm ci
      # Same browser cache as `web-e2e` — see the rationale there. Identical key,
      # so whichever job runs first warms the entry for the other; if this job's
      # browser set ever diverges, `PLAYWRIGHT_BROWSERS` changes the key with it.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: web
        # Assigned first rather than substituted inline: an inline `$(...)` inside
        # echo/printf discards the command's exit status, so a failing `node -p`
        # would write an empty value, pass the step, and yield the plausible-looking
        # key `playwright-Linux-` — caching the wrong thing silently, forever. The
        # assignment propagates the failure to `bash -e` instead. `printf` over
        # `echo` for the usual reason: no escape or leading-dash interpretation.
        run: |
          version=$(node -p "require('playwright-core/package.json').version")
          [ -n "$version" ] || { echo "::error::could not resolve the playwright-core version"; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_BROWSERS }}-${{ steps.playwright.outputs.version }}
      # Unchanged on purpose: with the cache restored this detects the browser is
      # already present and skips the download, leaving only the apt-get half of
      # `--with-deps`. A conditional install would buy nothing and add a branch.
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps "$PLAYWRIGHT_BROWSERS"
      - name: Run browser test tier
        working-directory: web
        run: npm run test:browser
      - name: Upload browser test failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-browser-failures
          path: |
            web/src/**/__screenshots__/
            web/.vitest-attachments/
          retention-days: 7
