name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The workspace MSRV must mirror the pinned crustywad release's (#52).
      # Both sides use the same `[... | tostring] | unique | join` shape, so the
      # comparison stays a single deterministic string: it catches drift between
      # our own members, survives more than one resolved crustywad, and reports a
      # missing rust-version as a literal `null` instead of an empty field.
      - name: MSRV matches crustywad
        run: |
          ws=$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].rust_version | tostring] | unique | join(",")')
          dep=$(cargo metadata --format-version 1 | jq -r '[.packages[] | select(.name=="crustywad") | .rust_version | tostring] | unique | join(",")')
          echo "workspace: $ws  crustywad: $dep"
          [ "$ws" = "$dep" ] || { echo "::error::rust-version drift: workspace $ws vs crustywad $dep"; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - run: cargo test --workspace --all-features

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p crustyview-web --target wasm32-unknown-unknown

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
      - run: wasm-pack test --node crates/crustyview-web

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build wasm into the app
        run: cd crates/crustyview-web && wasm-pack build --target web --out-dir ../../web/src/wasm
      - name: Install, check, test, build
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4 # cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # The action exits 0 on a rejected upload by default; both this and the
          # removal of `continue-on-error` are needed for a failure to be visible.
          fail_ci_if_error: true

  security-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - uses: taiki-e/install-action@c0977eb8b4952c1e8e932703147dba6f76856a53 # cargo-deny
      - run: cargo deny check

  sweep-freedoom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - name: Fetch Freedoom
        run: ./scripts/fetch-freedoom.sh "$RUNNER_TEMP/freedoom"
      - name: Sweep Freedoom
        run: CRUSTYVIEW_WAD_DIR="$RUNNER_TEMP/freedoom" cargo test -p crustyview-core --test wad_sweep --all-features -- --nocapture

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2 # wasm-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch Freedoom
        run: ./scripts/fetch-freedoom.sh .freedoom
      - name: Build wasm into the app
        run: cd crates/crustyview-web && wasm-pack build --target web --out-dir ../../web/src/wasm
      - name: Install and build the app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
