name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Same rule and same group shape as ci.yml — see the long explanation there. Short
# version: `cancel-in-progress: false` alone does not protect `main`, because queuing a
# run cancels whatever is already pending in its group. Keying non-PR events on
# `github.sha` gives each commit its own group, so a `main` analysis is never canceled
# and never leaves a gap in the code-scanning baseline. This workflow also runs on
# `schedule`, which is why `github.event_name` is in the key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    # This job used to be gated on `github.event.repository.visibility == 'public'`,
    # because code scanning needs GitHub Advanced Security, which a private personal
    # repository does not get. The repo went public on 2026-08-10 and the guard became
    # permanently true, so it is gone (#112) — a condition that can no longer be false
    # only misleads.
    #
    # One property of that guard is worth keeping on the record, because it looks like
    # a bug when you meet it: `github.event.repository.visibility` is read from the
    # **event payload**, which is frozen when the event fires. Re-running a workflow
    # from while the repo was private replayed `private` and skipped again, so the
    # guard could not be cleared by a re-run — only a new push or PR event activated it.
    #
    # Job-level `permissions` REPLACES the workflow default rather than merging with
    # it, so `contents: read` is restated here; without it this job would run with
    # `contents: none`.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          languages: rust
          queries: security-extended
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
      - run: cargo build --workspace
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
