<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>crustyview</title>
    <script>
      let stored = null;
      try {
        stored = localStorage.getItem('crustyview-theme');
      } catch {
        // Blocked storage — fall through to the system preference.
      }
      let dark = stored === 'dark';
      if (stored !== 'dark' && stored !== 'light') {
        try {
          dark = matchMedia('(prefers-color-scheme: dark)').matches;
        } catch {
          // No matchMedia — keep the light default; the app corrects on mount.
        }
      }
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
