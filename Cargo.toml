[workspace]
members = ["crates/crustyview-core", "crates/crustyview-web", "crates/crustyview-native"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
# Mirrors crustywad's MSRV; CI fails on drift (#52).
rust-version = "1.94.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masriamir/crustyview"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Escape hatch: uncomment to consume unreleased crustywad fixes from main.
# [patch.crates-io]
# crustywad = { git = "https://github.com/masriamir/crustywad", branch = "main" }
