[workspace]
members = ["crates/crustyview-core", "crates/crustyview"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masriamir/crustyview"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Escape hatch: uncomment to consume unreleased crustywad fixes from main.
# [patch.crates-io]
# crustywad = { git = "https://github.com/masriamir/crustywad", branch = "main" }
